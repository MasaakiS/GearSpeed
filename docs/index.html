<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GearSpeed</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <h1>GearSpeed</h1>

  <form id="settings">
    <div class="controls-wrapper">

      <div class="form-row">
        <label for="front">Front gear:</label>
        <input type="number" id="front" min="20" max="60" value="40">
      </div>

      <div class="form-row">
        <label for="wheel">Wheel:</label>
        <select id="wheel">
          <option value="622">700c</option>
          <option value="571">650c</option>
        </select>
      </div>

      <div class="form-row">
        <label for="tire">Tire width (mm):</label>
        <input type="number" id="tire" min="23" max="50" value="28">
      </div>

      <div class="form-row">
        <label for="mode">Mode:</label>
        <select id="mode">
          <option value="preset" selected>Preset</option>
          <option value="custom">Custom</option>
        </select>
      </div>

      <div id="preset-section">
        <div class="form-row">
          <label for="filter-speeds">Speeds:</label>
          <select id="filter-speeds">
            <option value="">All</option>
            <option value="9">9s</option>
            <option value="10">10s</option>
            <option value="11">11s</option>
            <option value="12" selected>12s</option>
            <option value="13">13s</option>
          </select>
        </div>

        <div class="form-row">
          <label for="filter-category">Category:</label>
          <select id="filter-category">
            <option value="">All</option>
            <option value="ロード">ロード</option>
            <option value="MTB">MTB</option>
            <option value="グラベル">グラベル</option>
          </select>
        </div>

        <div class="form-row">
          <label for="filter-manufacturer">Manufacturer:</label>
          <select id="filter-manufacturer">
            <option value="">All</option>
          </select>
        </div>

        <div class="form-row">
          <label for="preset">Preset cassette:</label>
          <select id="preset">
            <option value="">-- select --</option>
          </select>
        </div>
      </div>

      <div id="custom-gears" style="display:none">
        <div class="form-row">
          <label for="rear">Rear gears (comma separated):</label>
        </div>
                <textarea id="rear" placeholder="e.g. 11,13,15" rows="1" cols="30"></textarea>
        <button type="button" id="save-custom">Save custom set</button>
        <label>Saved sets:
          <select id="custom-list"></select>
        </label>
      </div>

    </div>

    <button type="button" id="generate">Generate</button>
    <button type="button" id="clear">Clear</button>
    <button type="button" id="copy">Copy</button>
  </form>

  <div id="table"></div>

</body>
</html>
