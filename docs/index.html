<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GearSpeed</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <h1>GearSpeed</h1>

  <form id="settings">
    <label>Front gear: <input type="number" id="front" min="20" max="60" value="50"></label><br>
    <label>Wheel: 
      <select id="wheel">
        <option value="622">700c</option>
        <option value="571">650c</option>
      </select>
    </label><br>
    <label>Tire width (mm): <input type="number" id="tire" min="23" max="50" value="25"></label><br>
    <label>Mode: 
      <select id="mode">
        <option value="all">All gears</option>
        <option value="custom">Custom</option>
      </select>
    </label><br>
    <div id="custom-gears" style="display:none">
      <label>Rear gears (comma separated):<br>
        <textarea id="rear" placeholder="e.g. 11,13,15" rows="3" cols="30"></textarea>
      </label><br>
    </div>
    <button type="button" id="generate">Generate</button>
    <button type="button" id="clear">Clear</button>
    <button type="button" id="copy">Copy</button>
    <button type="button" id="download-settings">Download settings</button>
    <button type="button" id="export-custom">Export custom gears</button>
  </form>
  <div id="table"></div>

</body>
</html>
